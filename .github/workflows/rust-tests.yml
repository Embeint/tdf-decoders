name: Rust Tests

on:
  pull_request:

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Test
        run: cargo test --workspace --locked

  extension-test:
    name: cargo test with extension definitions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install generator dependencies
        run: python3 -m pip install jinja2 numpy

      - name: Generate extension decoders
        run: python3 common/scripts/generate_decoders.py common/test_data/extension_definitions.json

      - name: Test
        run: cargo test --workspace --locked
